name: Smoke F9K1103 Cudy WIP03 auth

on:
  push:
    branches:
      - f9k1103-cudy-port-wip03
    paths:
      - '.github/workflows/audit-f9k1103-cudy-wip03-auth.yml'
      - 'firmware/f9k1103-lede-17.01.5/cudy-port/dispatcher-lede-cudy.lua'
      - 'firmware/f9k1103-lede-17.01.5/cudy-port/sys-lede.lua'
      - 'firmware/f9k1103-lede-17.01.5/cudy-port/sysauth-lede-cudy.js'
      - 'firmware/f9k1103-lede-17.01.5/cudy-port/95-f9k1103-cudy-runtime'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y lua5.1 dash grep
      - uses: actions/checkout@v4
      - name: Validate native auth bridge
        shell: bash
        run: |
          set -euo pipefail
          P=firmware/f9k1103-lede-17.01.5/cudy-port

          luac5.1 -p "$P/dispatcher-lede-cudy.lua"
          luac5.1 -p "$P/sys-lede.lua"
          dash -n "$P/95-f9k1103-cudy-runtime"

          grep -Fq 'local checkuser = (user == "admin") and "root" or user' \
            "$P/dispatcher-lede-cudy.lua"
          grep -Fq 'return (pwh == nil or nixio.crypt(pass, pwh) == pwh)' \
            "$P/sys-lede.lua"

          grep -Fq "uci set luci.main.sysauth='admin'" "$P/95-f9k1103-cudy-runtime"
          grep -Fq "uci set luci.sauth.defpasswd='0'" "$P/95-f9k1103-cudy-runtime"
          grep -Fq "uci -q delete luci.sauth.salt" "$P/95-f9k1103-cudy-runtime"

          ! grep -Fq '/admin/get_token' "$P/sysauth-lede-cudy.js"
          ! grep -Fq 'crypt -ea' "$P/dispatcher-lede-cudy.lua"
          ! grep -Fq 'crypt -da' "$P/dispatcher-lede-cudy.lua"
          ! grep -Eq 'crypt -d .* -k ' "$P/dispatcher-lede-cudy.lua"

          echo 'WIP03 native-auth bridge smoke: PASS'
