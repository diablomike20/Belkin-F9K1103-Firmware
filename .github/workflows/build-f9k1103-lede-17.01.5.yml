name: Build F9K1103 LEDE 17.01.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-f9k1103-lede-17.01.5.yml'
      - 'firmware/f9k1103-lede-17.01.5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f9k1103-lede-17.01.5-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 150
    steps:
      - name: Install checkout/build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y             build-essential ca-certificates clang flex bison g++ gawk gcc-multilib             gettext git libncurses5-dev libssl-dev python2.7 python-is-python2             python3 python3-distutils rsync unzip zlib1g-dev file wget perl             subversion swig time u-boot-tools
      - uses: actions/checkout@v4
      - name: Build F9K1103 v1 LEDE 17.01.5 image
        run: bash firmware/f9k1103-lede-17.01.5/build-lede-17.01.5.sh
      - name: Show validation
        run: |
          ls -lah out-f9k1103-lede-17.01.5
          cat out-f9k1103-lede-17.01.5/STATIC-VALIDATION.txt
          cat out-f9k1103-lede-17.01.5/SHA256SUMS.txt
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: F9K1103-v1-LEDE-17.01.5-PORT-WIP
          path: out-f9k1103-lede-17.01.5/
          if-no-files-found: error
          compression-level: 0
