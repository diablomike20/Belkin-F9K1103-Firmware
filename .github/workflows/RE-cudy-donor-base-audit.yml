name: RE Cudy donor base audit

on:
  push:
    branches: [re-cudy-donor-base-audit]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip file rsync

      - name: Download and extract candidate Cudy firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/re-cudy-donor-audit RE-CUDY-DONOR-BASE-AUDIT
          mkdir -p /tmp/re-cudy-donor-audit RE-CUDY-DONOR-BASE-AUDIT

          cat > /tmp/re-cudy-donor-audit/candidates.tsv <<'EOF'
          WR1200V3_R149_2.5.24|https://www.cudy.com/cdn/shop/files/WR1200V3-R149-2.5.24-20260727-130115-flash.zip?v=13150855755067218599
          WR1200V2_R26_2.4.23|https://www.cudy.com/cdn/shop/files/WR1200V2-R26-2.4.23-20251224-145945-flash.zip?v=10287497656812635253
          WR1200E_R62_2.4.25|https://www.cudy.com/cdn/shop/files/WR1200E-R62-2.4.25-20260114-184136-flash.zip?v=12982462962593522136
          WR1300E_R45_1.15.30|https://www.cudy.com/cdn/shop/files/WR1300E-R45-1.15.30-20230504-170701-flash.zip
          WR300S_R93_2.4.25|https://www.cudy.com/cdn/shop/files/WR300S-R93-2.4.25-20260106-173004-flash.zip
          EOF

          while IFS='|' read -r id url; do
            [ -n "$id" ] || continue
            d="/tmp/re-cudy-donor-audit/$id"
            mkdir -p "$d"
            echo "=== $id ==="
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$d/fw.zip"
            sha256sum "$d/fw.zip" > "$d/ZIP-SHA256.txt"
            unzip -q "$d/fw.zip" -d "$d/unzip"
            bin="$(find "$d/unzip" -maxdepth 2 -type f -name '*.bin' | head -n1)"
            [ -n "$bin" ] || { echo "No BIN for $id" >&2; exit 1; }
            cp "$bin" "$d/firmware.bin"
            sha256sum "$d/firmware.bin" > "$d/BIN-SHA256.txt"
            python3 - "$d/firmware.bin" "$d/SQUASHFS-OFFSET.txt" "$d/rootfs.squashfs" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          b=p.read_bytes()
          candidates=[]
          for magic in (b'hsqs', b'sqsh'):
              start=0
              while True:
                  i=b.find(magic,start)
                  if i<0: break
                  candidates.append(i); start=i+1
          if not candidates:
              raise SystemExit("SquashFS magic not found")
          off=min(candidates)
          pathlib.Path(sys.argv[2]).write_text(str(off)+"\n")
          pathlib.Path(sys.argv[3]).write_bytes(b[off:])
          PY
            sudo unsquashfs -no-progress -d "$d/rootfs" "$d/rootfs.squashfs" >/dev/null
            sudo chown -R "$(id -u):$(id -g)" "$d/rootfs"
            unsquashfs -s "$d/rootfs.squashfs" > "$d/SQUASHFS-SUPERBLOCK.txt"
          done < /tmp/re-cudy-donor-audit/candidates.tsv

      - name: Build exact comparison report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,os,json,csv,re,subprocess,collections
          base=pathlib.Path('/tmp/re-cudy-donor-audit')
          out=pathlib.Path('RE-CUDY-DONOR-BASE-AUDIT')
          ids=[x.split('|')[0] for x in (base/'candidates.tsv').read_text().splitlines() if x.strip()]
          summary=[]
          manifests={}
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          def size_tree(p):
              return sum(x.stat().st_size for x in p.rglob('*') if x.is_file() and not x.is_symlink())
          def files_tree(p):
              return sum(1 for x in p.rglob('*') if x.is_file() and not x.is_symlink())
          def read(p):
              try:return p.read_text(errors='replace')
              except:return ''
          for id in ids:
              d=base/id; root=d/'rootfs'
              row={'id':id}
              row['zip_bytes']=(d/'fw.zip').stat().st_size
              row['bin_bytes']=(d/'firmware.bin').stat().st_size
              row['zip_sha256']=sha(d/'fw.zip')
              row['bin_sha256']=sha(d/'firmware.bin')
              row['squashfs_offset']=int((d/'SQUASHFS-OFFSET.txt').read_text().strip())
              sb=read(d/'SQUASHFS-SUPERBLOCK.txt')
              m=re.search(r'Filesystem size ([0-9.]+) Kbytes \(([0-9]+) bytes\)', sb)
              row['squashfs_bytes_used']=int(m.group(2)) if m else 0
              row['rootfs_files']=files_tree(root)
              row['rootfs_bytes_unpacked']=size_tree(root)
              for rel,key in [
                  ('usr/lib/lua/luci','luci_bytes'),('www','www_bytes'),('usr/bin','usr_bin_bytes'),
                  ('usr/sbin','usr_sbin_bytes'),('etc','etc_bytes'),('lib/modules','modules_bytes')]:
                  p=root/rel; row[key]=size_tree(p) if p.exists() else 0
              rel=read(root/'etc/openwrt_release')+'\n'+read(root/'etc/rom_version')+'\n'+read(root/'etc/os-release')
              row['release']=' '.join(x.strip() for x in rel.splitlines() if x.strip())[:700]
              # exact service/vendor dependencies
              names=['bdinfo','mcore','pingcheck','cmagent','cmsd','hcshd','gcom','mosquitto','hyfibr']
              for n in names:
                  hits=[str(p.relative_to(root)) for p in root.rglob(n) if p.is_file() or p.is_symlink()]
                  row[n]=';'.join(hits[:10])
              ctr=root/'usr/lib/lua/luci/controller'
              row['controller_files']=files_tree(ctr) if ctr.exists() else 0
              cbi=root/'usr/lib/lua/luci/model/cbi'
              row['cbi_files']=files_tree(cbi) if cbi.exists() else 0
              # executable ELF architecture summary
              arch=collections.Counter()
              elf_files=[]
              for top in ['bin','sbin','usr/bin','usr/sbin','usr/lib','lib']:
                  p=root/top
                  if not p.exists(): continue
                  for f in p.rglob('*'):
                      if not f.is_file() or f.is_symlink(): continue
                      try:
                          head=f.read_bytes()[:4]
                      except: continue
                      if head==b'\x7fELF':
                          elf_files.append(f)
              for f in elf_files:
                  try:
                      desc=subprocess.check_output(['file','-b',str(f)],text=True).strip()
                  except: desc='?'
                  if 'MIPS' in desc: k='MIPS'
                  elif 'ARM' in desc or 'aarch64' in desc: k='ARM'
                  else:k=desc.split(',')[0]
                  arch[k]+=1
              row['elf_count']=len(elf_files)
              row['elf_arch']=';'.join(f'{k}:{v}' for k,v in arch.items())
              # important defaults
              defaults={}
              for pat in ['etc/uci-defaults/*wlan*','etc/uci-defaults/*network*','etc/uci-defaults/*wireless*','bin/config_generate','lib/wifi/*']:
                  for f in root.glob(pat):
                      if f.is_file():
                          defaults[str(f.relative_to(root))]=sha(f)
              row['defaults']=';'.join(f'{k}={v}' for k,v in sorted(defaults.items()))
              # UI manifest
              man={}
              for relroot in ['usr/lib/lua/luci','www']:
                  p=root/relroot
                  if p.exists():
                      for f in p.rglob('*'):
                          if f.is_file() and not f.is_symlink():
                              man[str(f.relative_to(root))]=sha(f)
              manifests[id]=man
              summary.append(row)
              # candidate detail text
              detail=out/f'RE-{id}-DETAIL.txt'
              detail.write_text('\n'.join([
                  f'ID={id}',f'ZIP_BYTES={row["zip_bytes"]}',f'BIN_BYTES={row["bin_bytes"]}',
                  f'ZIP_SHA256={row["zip_sha256"]}',f'BIN_SHA256={row["bin_sha256"]}',
                  f'SQUASHFS_OFFSET={row["squashfs_offset"]}',f'SQUASHFS_BYTES_USED={row["squashfs_bytes_used"]}',f'ROOTFS_FILES={row["rootfs_files"]}',
                  f'ROOTFS_UNPACKED_BYTES={row["rootfs_bytes_unpacked"]}',f'LUCi_BYTES={row["luci_bytes"]}',
                  f'WWW_BYTES={row["www_bytes"]}',f'MODULES_BYTES={row["modules_bytes"]}',
                  f'ELF_COUNT={row["elf_count"]}',f'ELF_ARCH={row["elf_arch"]}',
                  f'RELEASE={row["release"]}',f'DEFAULTS={row["defaults"]}',
                  *[f'{n.upper()}={row[n]}' for n in names]
              ])+'\n')
          # pairwise exact UI file equality
          pairs=[]
          for i,a in enumerate(ids):
              for b in ids[i+1:]:
                  ma,mb=manifests[a],manifests[b]
                  common=set(ma)&set(mb)
                  same=sum(ma[p]==mb[p] for p in common)
                  union=set(ma)|set(mb)
                  pairs.append({
                      'a':a,'b':b,'a_files':len(ma),'b_files':len(mb),'common_paths':len(common),
                      'identical_common':same,'identical_common_pct':round(100*same/len(common),2) if common else 0,
                      'identical_union_pct':round(100*same/len(union),2) if union else 0
                  })
          with open(out/'RE-CANDIDATE-SUMMARY.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=summary[0].keys());w.writeheader();w.writerows(summary)
          with open(out/'RE-PAIRWISE-UI-HASH-COMPARISON.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pairs[0].keys());w.writeheader();w.writerows(pairs)
          # WR300S vs WR1200V2 deep wireless/runtime comparison
          A='WR1200V2_R26_2.4.23'
          B='WR300S_R93_2.4.25'
          ra=base/A/'rootfs'
          rb=base/B/'rootfs'

          def collect_refs(root, needles):
              rows=[]
              search_roots=[
                  root/'etc', root/'lib', root/'bin', root/'sbin',
                  root/'usr/lib/lua', root/'usr/bin', root/'usr/sbin', root/'www'
              ]
              for sr in search_roots:
                  if not sr.exists(): continue
                  for p in sr.rglob('*'):
                      if not p.is_file() or p.is_symlink(): continue
                      try:
                          b=p.read_bytes()
                      except: continue
                      if len(b)>5_000_000: continue
                      txt=b.decode('latin1','ignore')
                      matched=[n for n in needles if n in txt]
                      if matched:
                          rows.append((str(p.relative_to(root)), ','.join(matched)))
              return rows

          needles=['radio0','radio1','wlan00','wlan10','wlan1','wlan0','5g','5G','2.4G','mt7663','mt761','iwinfo','wifi-iface','wifi-device']
          refsA=collect_refs(ra,needles)
          refsB=collect_refs(rb,needles)

          with open(out/'RE-WR1200V2-vs-WR300S-WIRELESS-REFS.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['model','path','matched_tokens'])
              for p,m in refsA: w.writerow([A,p,m])
              for p,m in refsB: w.writerow([B,p,m])

          # compare exact important files and text diffs
          important=[
              'bin/config_generate',
              'etc/uci-defaults/01_network',
              'etc/uci-defaults/30_wlan',
              'etc/uci-defaults/40_luci-wireless',
              'usr/lib/lua/luci/model/network.lua',
              'usr/lib/lua/luci/tools/status.lua',
              'usr/lib/lua/luci/model/cbi/admin_network/wifi.lua',
              'usr/lib/lua/luci/controller/admin/network.lua',
              'usr/lib/lua/luci/description.lua',
              'usr/lib/lua/luci/gui.lua',
          ]
          import difflib
          report=[]
          for rel in important:
              pa,pb=ra/rel,rb/rel
              ea,eb=pa.exists(),pb.exists()
              report += [f'=== {rel} ===',f'WR1200V2_EXISTS={ea}',f'WR300S_EXISTS={eb}']
              if ea: report.append('WR1200V2_SHA256='+sha(pa))
              if eb: report.append('WR300S_SHA256='+sha(pb))
              if ea and eb:
                  ba,bb=pa.read_bytes(),pb.read_bytes()
                  report.append('BYTE_IDENTICAL='+str(ba==bb))
                  # only produce unified diff if both are textual enough
                  try:
                      ta=ba.decode('utf-8')
                      tb=bb.decode('utf-8')
                      if ta!=tb:
                          report += list(difflib.unified_diff(
                              ta.splitlines(),tb.splitlines(),
                              fromfile='WR1200V2/'+rel,tofile='WR300S/'+rel,lineterm=''
                          ))[:2000]
                  except: pass
              report.append('')
          (out/'RE-WR1200V2-vs-WR300S-IMPORTANT-FILE-DIFF.txt').write_text('\n'.join(report)+'\n')

          # file ownership deltas under the wireless/network/runtime relevant tree
          trees=['etc/uci-defaults','lib/wifi','usr/lib/lua/luci','etc/init.d','usr/bin','usr/sbin']
          def manifest_subset(root):
              m={}
              for rel in trees:
                  p=root/rel
                  if not p.exists(): continue
                  for f in p.rglob('*'):
                      if f.is_file() and not f.is_symlink():
                          m[str(f.relative_to(root))]=sha(f)
              return m
          ma,mb=manifest_subset(ra),manifest_subset(rb)
          paths=sorted(set(ma)|set(mb))
          with open(out/'RE-WR1200V2-vs-WR300S-RUNTIME-MANIFEST-DIFF.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['path','wr1200v2','wr300s','class'])
              for p in paths:
                  a,b=ma.get(p),mb.get(p)
                  cls='IDENTICAL' if a and b and a==b else 'DIFFERENT' if a and b else 'WR1200_ONLY' if a else 'WR300S_ONLY'
                  w.writerow([p,a or '',b or '',cls])

          # radio-specific shell and UCI creation evidence
          def grep_lines(root, tokens):
              outrows=[]
              for sr in [root/'etc',root/'lib',root/'bin',root/'usr/lib/lua']:
                  if not sr.exists(): continue
                  for p in sr.rglob('*'):
                      if not p.is_file() or p.is_symlink(): continue
                      try: txt=p.read_text(errors='ignore')
                      except: continue
                      for i,line in enumerate(txt.splitlines(),1):
                          if any(t in line for t in tokens):
                              outrows.append((str(p.relative_to(root)),i,line[:1000]))
              return outrows
          toks=['radio1','wlan10','wlan1','mt7663','mt761','5G','5g','HT80','VHT','802.11ac','11ac']
          ga,gb=grep_lines(ra,toks),grep_lines(rb,toks)
          with open(out/'RE-WR1200V2-vs-WR300S-RADIO1-5G-EVIDENCE.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['model','path','line','text'])
              for p,i,l in ga:w.writerow([A,p,i,l])
              for p,i,l in gb:w.writerow([B,p,i,l])

          # daemon/service comparison
          service_names=['cmagent','cmsd','mosquitto','hcshd','pingcheck','mcore','bdinfo','hyfibr']
          with open(out/'RE-WR1200V2-vs-WR300S-SERVICE-COMPARISON.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['service','wr1200v2_paths','wr300s_paths'])
              for n in service_names:
                  ha=sorted(str(p.relative_to(ra)) for p in ra.rglob(n) if p.is_file() or p.is_symlink())
                  hb=sorted(str(p.relative_to(rb)) for p in rb.rglob(n) if p.is_file() or p.is_symlink())
                  w.writerow([n,';'.join(ha),';'.join(hb)])

          # concise machine-derived verdict inputs
          verdict=[]
          verdict.append('WR1200V2_vs_WR300S_DEEP_WIRELESS_RUNTIME')
          verdict.append(f'WR1200V2_UI_FILES={len(manifests[A])}')
          verdict.append(f'WR300S_UI_FILES={len(manifests[B])}')
          common=set(manifests[A])&set(manifests[B])
          same=sum(manifests[A][p]==manifests[B][p] for p in common)
          verdict.append(f'COMMON_UI_PATHS={len(common)}')
          verdict.append(f'IDENTICAL_COMMON_UI={same}')
          verdict.append(f'IDENTICAL_COMMON_UI_PCT={100*same/len(common):.2f}')
          verdict.append(f'WR1200_RADIO1_5G_REFS={len(ga)}')
          verdict.append(f'WR300S_RADIO1_5G_REFS={len(gb)}')
          verdict.append('NOTE=Counts are evidence leads; exact ownership requires reading the generated CSV/diffs.')
          (out/'RE-WR1200V2-vs-WR300S-DEEP-SUMMARY.txt').write_text('\n'.join(verdict)+'\n')

          # exact excerpts/default source for review
          for id in ids:
              root=base/id/'rootfs'
              dd=out/f'RE-{id}-DEFAULTS'
              dd.mkdir()
              for pat in ['etc/uci-defaults/*','bin/config_generate']:
                  for f in root.glob(pat):
                      if f.is_file() and f.stat().st_size < 500000:
                          dest=dd/('RE-'+str(f.relative_to(root)).replace('/','__'))
                          try: dest.write_bytes(f.read_bytes())
                          except: pass
          PY

          (
            cd RE-CUDY-DONOR-BASE-AUDIT
            sha256sum RE-* > RE-SHA256SUMS.txt || true
          )
          tar -czf RE-CUDY-DONOR-BASE-AUDIT-01.tar.gz RE-CUDY-DONOR-BASE-AUDIT
          sha256sum RE-CUDY-DONOR-BASE-AUDIT-01.tar.gz > RE-CUDY-DONOR-BASE-AUDIT-01.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RE-CUDY-DONOR-BASE-AUDIT-01
          path: |
            RE-CUDY-DONOR-BASE-AUDIT-01.tar.gz
            RE-CUDY-DONOR-BASE-AUDIT-01.tar.gz.sha256
