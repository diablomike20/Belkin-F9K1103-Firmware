name: Fast repack F9K1103 Cudy WIP03 radio fix

on:
  push:
    branches:
      - f9k1103-cudy-port-wip03
    paths:
      - '.github/workflows/repack-f9k1103-cudy-wip03-radiofix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools unzip python3 curl

      - name: Download last successful WIP03 base artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11313772739/zip" \
            -o /tmp/wip03-base.zip
          mkdir -p /tmp/wip03-base
          unzip -q /tmp/wip03-base.zip -d /tmp/wip03-base
          test -s /tmp/wip03-base/lede-ramips-rt3883-f9k1103-squashfs-sysupgrade.bin

      - name: Repack corrected runtime adapter
        shell: bash
        run: |
          set -euo pipefail
          IMG=/tmp/wip03-base/lede-ramips-rt3883-f9k1103-squashfs-sysupgrade.bin
          WORK=/tmp/wip03-repack
          OUT="$GITHUB_WORKSPACE/out-wip03-radiofix"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"

          python3 - "$IMG" "$WORK" <<'PY'
import pathlib, struct, sys
img=pathlib.Path(sys.argv[1]).read_bytes()
out=pathlib.Path(sys.argv[2])

if len(img) < 128:
    raise SystemExit("image too short")

magic,hcrc,ts,size,load,entry,dcrc=struct.unpack(">7I", img[:28])
if magic != 0x27051956:
    raise SystemExit("bad uImage magic")
rootfs_off=64+size
if img[rootfs_off:rootfs_off+4] != b"hsqs":
    raise SystemExit(f"SquashFS magic missing at {rootfs_off}")

# SquashFS v4 little-endian bytes_used field is offset 40.
bytes_used=struct.unpack_from("<Q", img, rootfs_off+40)[0]
rootfs_end=rootfs_off+bytes_used
if rootfs_end > len(img):
    raise SystemExit("invalid squashfs bytes_used")

# OpenWrt fwtool trailer: final u32 is total metadata-record size.
tsize=struct.unpack(">I", img[-4:])[0]
if not (16 <= tsize <= 65536 and tsize <= len(img)-rootfs_end):
    raise SystemExit(f"invalid fwtool trailer size: {tsize}")
meta=img[-tsize:]

(out/"kernel.bin").write_bytes(img[:rootfs_off])
(out/"rootfs.squashfs").write_bytes(img[rootfs_off:rootfs_end])
(out/"fwtool-meta.bin").write_bytes(meta)
(out/"layout.txt").write_text(
    f"uimage_payload_size={size}\n"
    f"rootfs_offset={rootfs_off}\n"
    f"rootfs_bytes_used={bytes_used}\n"
    f"fwtool_record_size={tsize}\n"
)
PY

          unsquashfs -no-progress -d "$WORK/rootfs" "$WORK/rootfs.squashfs" >/dev/null

          TARGET="$WORK/rootfs/etc/uci-defaults/95-f9k1103-cudy-runtime"
          test -f "$TARGET"
          cp firmware/f9k1103-lede-17.01.5/cudy-port/95-f9k1103-cudy-runtime "$TARGET"
          chmod 0755 "$TARGET"

          grep -q "radio0) target=\"wlan00\"" "$TARGET"
          grep -q "radio1) target=\"wlan10\"" "$TARGET"
          grep -q "wireless.wlan00.device='radio0'" "$TARGET"
          grep -q "wireless.wlan10.device='radio1'" "$TARGET"

          # Preserve LEDE rootfs compression family and block size.
          mksquashfs "$WORK/rootfs" "$WORK/rootfs-new.squashfs" \
            -comp xz -b 262144 -noappend -no-progress >/dev/null

          cat "$WORK/kernel.bin" "$WORK/rootfs-new.squashfs" "$WORK/fwtool-meta.bin" \
            > "$OUT/RE-F9K1103-LEDE-17.01.5-CUDY-WIP03-RADIOFIX-sysupgrade.bin"

          # Re-open final image and statically verify the unchanged kernel
          # uImage CRC plus the new SquashFS location/size and total image limit.
          python3 - "$OUT/RE-F9K1103-LEDE-17.01.5-CUDY-WIP03-RADIOFIX-sysupgrade.bin" "$OUT" <<'PY'
import binascii, pathlib, struct, sys
p=pathlib.Path(sys.argv[1])
out=pathlib.Path(sys.argv[2])
b=p.read_bytes()
hdr=b[:64]
magic,hcrc,ts,size,load,entry,dcrc=struct.unpack(">7I",hdr[:28])
name=hdr[32:64].split(b"\0",1)[0].decode("ascii","replace")
hz=bytearray(hdr); hz[4:8]=b"\0\0\0\0"
hc=binascii.crc32(hz)&0xffffffff
payload=b[64:64+size]
dc=binascii.crc32(payload)&0xffffffff
sq=64+size
ok=(magic==0x27051956 and hcrc==hc and dcrc==dc and
    name=="N750F9K1103VB" and b[sq:sq+4]==b"hsqs" and
    len(b)<=7224*1024)
report=[
 f"file={p.name}",
 f"size={len(b)}",
 f"uimage_name={name}",
 f"header_crc_ok={hcrc==hc}",
 f"payload_crc_ok={dcrc==dc}",
 f"squashfs_offset={sq}",
 f"fits_7224k={len(b)<=7224*1024}",
 f"VALIDATION={'PASS' if ok else 'FAIL'}",
]
(out/"RE-STATIC-VALIDATION.txt").write_text("\n".join(report)+"\n")
if not ok: raise SystemExit("static validation failed")
PY

          # Verify the corrected file from the final image, not only source tree.
          python3 - "$OUT/RE-F9K1103-LEDE-17.01.5-CUDY-WIP03-RADIOFIX-sysupgrade.bin" "$WORK/final-rootfs.sqfs" <<'PY'
import pathlib,struct,sys
b=pathlib.Path(sys.argv[1]).read_bytes()
size=struct.unpack(">I",b[12:16])[0]
off=64+size
used=struct.unpack_from("<Q",b,off+40)[0]
pathlib.Path(sys.argv[2]).write_bytes(b[off:off+used])
PY
          unsquashfs -no-progress -d "$WORK/final-rootfs" "$WORK/final-rootfs.sqfs" >/dev/null
          F="$WORK/final-rootfs/etc/uci-defaults/95-f9k1103-cudy-runtime"
          grep -q "radio0) target=\"wlan00\"" "$F"
          grep -q "radio1) target=\"wlan10\"" "$F"

          cp "$F" "$OUT/RE-95-f9k1103-cudy-runtime-IN-IMAGE"
          cp "$WORK/layout.txt" "$OUT/RE-BASE-LAYOUT.txt"
          sha256sum "$OUT"/* > "$OUT/RE-SHA256SUMS.txt"

          cat > "$OUT/RE-REPACK-INFO.txt" <<EOF
Base successful WIP03 artifact:
  artifact_id=11313772739
  source_commit=8aca39b3a52e037ad530ee14f03cf6ef82ecdc7e

Radio-fix source branch:
  branch=f9k1103-cudy-port-wip03
  source_commit=$GITHUB_SHA

Physical TARGET-TEST-01 truth:
  radio0 = PCI RT3091/3092 = 2.4 GHz = Cudy wlan00
  radio1 = RT3883 WMAC      = 5 GHz   = Cudy wlan10

Only rootfs payload was repacked. Kernel/uImage bytes and fwtool metadata
record are inherited unchanged from the prior successful WIP03 artifact.

This is a pre-flash TARGET-TEST candidate. Physical flash was not performed.
EOF

      - name: Show validation
        run: |
          cat out-wip03-radiofix/RE-STATIC-VALIDATION.txt
          cat out-wip03-radiofix/RE-REPACK-INFO.txt
          cat out-wip03-radiofix/RE-SHA256SUMS.txt

      - name: Upload fast radio-fix artifact
        uses: actions/upload-artifact@v4
        with:
          name: F9K1103-CUDY-WIP03-RADIOFIX-FAST-REPACK
          path: out-wip03-radiofix/
          if-no-files-found: error
          compression-level: 0
