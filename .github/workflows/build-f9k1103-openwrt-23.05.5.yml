name: Build F9K1103 OpenWrt 23.05.5

on:
  push:
    branches:
      - f9k1103-openwrt-23.05.5-build
    paths:
      - '.github/workflows/build-f9k1103-openwrt-23.05.5.yml'
      - 'firmware/f9k1103/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3 python3-setuptools swig libelf-dev u-boot-tools
      - name: Build F9K1103 v1 image
        run: bash firmware/f9k1103/build-openwrt-23.05.5.sh
      - name: Show outputs
        run: |
          ls -lah out-f9k1103
          cat out-f9k1103/SHA256SUMS.txt
          cat out-f9k1103/UIMAGE-HEADERS.txt || true
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: F9K1103-v1-OpenWrt-23.05.5-PORT-WIP
          path: out-f9k1103/
          if-no-files-found: error
          compression-level: 0
