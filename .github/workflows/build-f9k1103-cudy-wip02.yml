name: Build F9K1103 LEDE 17.01.5 Cudy WIP-02

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install repack tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools unzip wget file lua5.1

      - name: Download BUILD_VERIFIED native F9K1103 artifact
        uses: actions/download-artifact@v4
        with:
          name: F9K1103-v1-LEDE-17.01.5-PORT-WIP
          path: base-native
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37102439709

      - name: Repack native LEDE rootfs with Cudy WIP-02 layer
        run: bash firmware/f9k1103-lede-17.01.5-cudy/repack-cudy-wip02.sh

      - name: Show validation
        run: |
          ls -lah out-f9k1103-cudy-wip02/
          cat out-f9k1103-cudy-wip02/CUDY-WIP-02-STATIC-VALIDATION.txt
          cat out-f9k1103-cudy-wip02/SHA256SUMS.txt

      - name: Upload flashable Cudy checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: RE-F9K1103-LEDE-17.01.5-CUDY-WIP-02
          path: out-f9k1103-cudy-wip02/
          if-no-files-found: error
          compression-level: 0
