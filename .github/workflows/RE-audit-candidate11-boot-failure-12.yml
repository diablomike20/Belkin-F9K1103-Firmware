name: RE Candidate-11 boot failure forensic 12

on:
  push:
    branches: [re-f9k1103-cudy-first-bootfix-12]
    paths:
      - '.github/workflows/RE-audit-candidate11-boot-failure-12.yml'
      - 'firmware/f9k1103-lede-17.01.5/RE-prepare-wr1200e-cudy-first-stage.sh'
      - 'firmware/f9k1103-lede-17.01.5/cudy-port/RE-*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  forensic:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: re-f9k1103-cudy-first-bootfix-12

      - name: Install forensic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools unzip rsync python3 gh binutils file

      - name: Acquire exact WR1200E donor and exact booted WIP03
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reboot12 RE-CANDIDATE11-BOOT-FORENSIC-12
          mkdir -p /tmp/reboot12/donor /tmp/reboot12/target RE-CANDIDATE11-BOOT-FORENSIC-12

          URL='https://www.cudy.com/cdn/shop/files/WR1200E-R62-2.4.25-20260114-184136-flash.zip?v=12982462962593522136'
          ZIP_SHA='2e9a8dafc930a2070d45f706ec5d362428475044dcd791232f86eee7b9f4ef21'
          BIN_SHA='086055b0227910f9ddabbb13bfa6b06a3850105bd46a3572b76116bf5a3043fa'

          curl -fL --retry 3 "$URL" -o /tmp/reboot12/donor/donor.zip
          echo "$ZIP_SHA  /tmp/reboot12/donor/donor.zip" | sha256sum -c -
          unzip -q /tmp/reboot12/donor/donor.zip -d /tmp/reboot12/donor/unzip
          DONOR_BIN="$(find /tmp/reboot12/donor/unzip -type f -name '*.bin' | head -n1)"
          test -n "$DONOR_BIN"
          echo "$BIN_SHA  $DONOR_BIN" | sha256sum -c -

          python3 - "$DONOR_BIN" <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes()
          i=b.find(b'hsqs')
          if i < 0: raise SystemExit('donor squashfs missing')
          pathlib.Path('/tmp/reboot12/donor/rootfs.squashfs').write_bytes(b[i:])
          PY
          sudo unsquashfs -no-progress -d /tmp/reboot12/donor/root /tmp/reboot12/donor/rootfs.squashfs >/dev/null
          sudo chown -R "$(id -u):$(id -g)" /tmp/reboot12/donor/root

          gh run download 37248840659             --repo "${GITHUB_REPOSITORY}"             --name F9K1103-CUDY-WIP03-RADIOFIX-FAST-REPACK-V2             --dir /tmp/reboot12/target/artifact
          TARGET_BIN="$(find /tmp/reboot12/target/artifact -type f -name '*sysupgrade.bin' | head -n1)"
          test -n "$TARGET_BIN"
          echo '1c5418cb11093c368e7b519f375533277803c1d0225e4ad680626aef57a27560  '"$TARGET_BIN" | sha256sum -c -

          python3 - "$TARGET_BIN" <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes()
          i=b.find(b'hsqs')
          if i < 0: raise SystemExit('target squashfs missing')
          pathlib.Path('/tmp/reboot12/target/rootfs.squashfs').write_bytes(b[i:])
          PY
          sudo unsquashfs -no-progress -d /tmp/reboot12/target/root /tmp/reboot12/target/rootfs.squashfs >/dev/null
          sudo chown -R "$(id -u):$(id -g)" /tmp/reboot12/target/root

      - name: Reconstruct Candidate-11 stage rootfs
        shell: bash
        run: |
          set -euo pipefail
          bash firmware/f9k1103-lede-17.01.5/RE-prepare-wr1200e-cudy-first-stage.sh             /tmp/reboot12/donor/root             /tmp/reboot12/target/root             /tmp/reboot12/stage

      - name: Produce exact rootfs origin and early-boot reports
        shell: bash
        run: |
          set -euo pipefail
          O=RE-CANDIDATE11-BOOT-FORENSIC-12
          D=/tmp/reboot12/donor/root
          T=/tmp/reboot12/target/root
          S=/tmp/reboot12/stage

          manifest() {
            local root="$1" out="$2"
            (
              cd "$root"
              find . -xdev -printf '%y|%m|%u|%g|%p|%l\n' | sort
            ) > "$out"
          }
          hashes() {
            local root="$1" out="$2"
            (
              cd "$root"
              find . -xdev -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$out"
          }

          manifest "$D" "$O/RE-DONOR-METADATA-MANIFEST.txt"
          manifest "$T" "$O/RE-TARGET-METADATA-MANIFEST.txt"
          manifest "$S" "$O/RE-STAGE-METADATA-MANIFEST.txt"
          hashes "$D" "$O/RE-DONOR-SHA256.txt"
          hashes "$T" "$O/RE-TARGET-SHA256.txt"
          hashes "$S" "$O/RE-STAGE-SHA256.txt"

          python3 - "$D" "$T" "$S" "$O/RE-STAGE-ORIGIN-MAP.tsv" <<'PY'
          import os,sys,hashlib,stat
          D,T,S,out=sys.argv[1:]
          def sig(root,rel):
              p=os.path.join(root,rel)
              try: st=os.lstat(p)
              except FileNotFoundError: return None
              if stat.S_ISLNK(st.st_mode): return ('L',os.readlink(p),st.st_mode&0o7777)
              if stat.S_ISREG(st.st_mode):
                  h=hashlib.sha256(open(p,'rb').read()).hexdigest()
                  return ('F',h,st.st_mode&0o7777)
              if stat.S_ISDIR(st.st_mode): return ('D','',st.st_mode&0o7777)
              return ('O',str(st.st_mode),'')
          rels=[]
          for root in (D,T,S):
              for base,dirs,files in os.walk(root,followlinks=False):
                  for n in dirs+files:
                      rel=os.path.relpath(os.path.join(base,n),root)
                      if rel not in rels: rels.append(rel)
          with open(out,'w') as f:
              f.write('path\torigin\tstage\tdonor\ttarget\n')
              for rel in sorted(rels):
                  ds,ts,ss=sig(D,rel),sig(T,rel),sig(S,rel)
                  if ss is None: origin='ABSENT'
                  elif ss==ts and ss==ds: origin='BOTH_IDENTICAL'
                  elif ss==ts: origin='TARGET'
                  elif ss==ds: origin='DONOR'
                  else: origin='OTHER'
                  f.write(f'{rel}\t{origin}\t{ss!r}\t{ds!r}\t{ts!r}\n')
          PY

          cat > "$O/RE-CRITICAL-PATHS.txt" <<'EOF'
          bin/busybox
          bin/sh
          sbin/init
          sbin/procd
          sbin/ubusd
          sbin/logd
          sbin/netifd
          sbin/kmodloader
          sbin/hotplug-call
          sbin/ifup
          sbin/ifdown
          etc/preinit
          etc/rc.common
          etc/inittab
          etc/init.d/boot
          etc/init.d/done
          etc/init.d/system
          etc/init.d/network
          lib/functions.sh
          lib/functions/boot.sh
          lib/functions/preinit.sh
          lib/functions/system.sh
          lib/ramips.sh
          usr/share/libubox/jshn.sh
          EOF

          {
            echo -e 'path\tdonor_sha_or_link\ttarget_sha_or_link\tstage_sha_or_link\tstage_origin'
            while IFS= read -r p; do
              getv() {
                local root="$1" x="$root/$p"
                if [ -L "$x" ]; then printf 'LINK:%s' "$(readlink "$x")"
                elif [ -f "$x" ]; then sha256sum "$x" | awk '{print $1}'
                elif [ -d "$x" ]; then printf 'DIR'
                else printf 'ABSENT'; fi
              }
              dv="$(getv "$D")"; tv="$(getv "$T")"; sv="$(getv "$S")"
              if [ "$sv" = "$tv" ] && [ "$sv" = "$dv" ]; then origin=BOTH_IDENTICAL
              elif [ "$sv" = "$tv" ]; then origin=TARGET
              elif [ "$sv" = "$dv" ]; then origin=DONOR
              else origin=OTHER; fi
              printf '%s\t%s\t%s\t%s\t%s\n' "$p" "$dv" "$tv" "$sv" "$origin"
            done < "$O/RE-CRITICAL-PATHS.txt"
          } > "$O/RE-CRITICAL-ORIGIN.tsv"

          {
            for rootname in DONOR TARGET STAGE; do
              case "$rootname" in DONOR) R="$D";; TARGET) R="$T";; STAGE) R="$S";; esac
              echo "===== $rootname ====="
              for p in sbin/init sbin/procd sbin/ubusd sbin/logd sbin/netifd sbin/kmodloader bin/busybox; do
                f="$R/$p"
                [ -e "$f" ] || [ -L "$f" ] || continue
                echo "--- $p"
                file -L "$f" || true
                readelf -l "$f" 2>/dev/null | grep -E 'Requesting program interpreter|INTERP' || true
                readelf -d "$f" 2>/dev/null | grep NEEDED || true
              done
            done
          } > "$O/RE-EARLY-ELF-ABI.txt"

          {
            echo '===== BROKEN STAGE SYMLINKS ====='
            find "$S" -xdev -xtype l -printf '%p -> %l\n' | sort || true
            echo '===== INIT/PREINIT TREE ====='
            for x in etc/preinit etc/rc.common lib/functions.sh lib/functions lib/preinit etc/init.d etc/rc.d lib/netifd etc/hotplug.d; do
              echo "--- $x"
              if [ -e "$S/$x" ] || [ -L "$S/$x" ]; then
                find "$S/$x" -maxdepth 2 -printf '%y %m %p -> %l\n' 2>/dev/null | sort || true
              else echo ABSENT; fi
            done
          } > "$O/RE-EARLY-BOOT-TREE.txt"

          for x in etc/preinit etc/rc.common lib/functions.sh lib/functions lib/preinit etc/init.d lib/netifd etc/hotplug.d; do
            n="$(echo "$x" | tr '/' '_')"
            diff -ruN "$T/$x" "$D/$x" > "$O/RE-DIFF-TARGET-vs-DONOR-$n.txt" || true
          done

          grep -E $'\t(DONOR|TARGET|OTHER)\t' "$O/RE-STAGE-ORIGIN-MAP.tsv"             > "$O/RE-STAGE-NONIDENTICAL-ORIGINS.tsv" || true

          {
            echo 'FORENSIC=PASS'
            echo 'BOOT_GOOD_SHA256=1c5418cb11093c368e7b519f375533277803c1d0225e4ad680626aef57a27560'
            echo 'FAILED_CANDIDATE_SHA256=dcb998408d5284c6a82ca35c399822e1cedc614a03ece5cde31b478b9a2ad53c'
            echo 'KERNEL_PREFIX=BYTE_IDENTICAL_CONFIRMED_EXTERNALLY_AND_BY_BUILD_PROVENANCE'
            echo 'PURPOSE=ROOTFS_EARLY_BOOT_CAUSE_ISOLATION'
            echo 'FLASH_AUTHORIZATION=NO'
          } > "$O/RE-FORENSIC-STATUS.txt"

          tar -czf RE-CANDIDATE11-BOOT-FORENSIC-12.tar.gz "$O"
          sha256sum RE-CANDIDATE11-BOOT-FORENSIC-12.tar.gz > RE-CANDIDATE11-BOOT-FORENSIC-12.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RE-CANDIDATE11-BOOT-FORENSIC-12
          path: |
            RE-CANDIDATE11-BOOT-FORENSIC-12.tar.gz
            RE-CANDIDATE11-BOOT-FORENSIC-12.tar.gz.sha256

# trigger: second-push activation for newly added workflow
