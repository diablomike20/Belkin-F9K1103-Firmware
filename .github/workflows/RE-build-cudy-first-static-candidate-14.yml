 "$O/RE-CANDIDATE-STATUS.txt"
          grep -q '^TARGET_WIFI_CONTROL_CUDY_BUSYBOX_PARSE=PASS          grep -q '^TARGET_LAN_IP=192.168.10.2$' "$O/RE-CANDIDATE-STATUS.txt"
          grep -q '^DONOR_LAN_DEFAULT=192.168.10.1$' "$O/RE-CANDIDATE-STATUS.txt"
          grep -q '^BOOTFIX_BASIS=CANDIDATE11_12_NO_LINK_NO_WIFI$' "$O/RE-CANDIDATE-STATUS.txt"
