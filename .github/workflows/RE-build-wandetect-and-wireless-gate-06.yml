name: RE wan_detect build and wireless gate 06

on:
  push:
    branches: [re-f9k1103-wr1200e-cudy-full-rootfs-port]
    paths:
      - '.github/workflows/RE-build-wandetect-and-wireless-gate-06.yml'
      - 'firmware/f9k1103-lede-17.01.5/RE-wandetect-proc-compat.c'
      - 'firmware/f9k1103-lede-17.01.5/RE-wandetect-proc-compat-Makefile'
      - 'firmware/f9k1103-lede-17.01.5/RE-m4-1.4.18-glibc-sigstksz.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: re-wandetect06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git             libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file             wget curl squashfs-tools

      - name: Inspect exact WR1200E wireless defaults
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/re06 RE-WANDETECT-WIRELESS-GATE-06
          mkdir -p /tmp/re06 RE-WANDETECT-WIRELESS-GATE-06
          URL='https://www.cudy.com/cdn/shop/files/WR1200E-R62-2.4.25-20260114-184136-flash.zip?v=12982462962593522136'
          ZIP_SHA='2e9a8dafc930a2070d45f706ec5d362428475044dcd791232f86eee7b9f4ef21'
          curl -fL --retry 3 "$URL" -o /tmp/re06/donor.zip
          echo "$ZIP_SHA  /tmp/re06/donor.zip" | sha256sum -c -
          unzip -q /tmp/re06/donor.zip -d /tmp/re06/unzip
          BIN="$(find /tmp/re06/unzip -type f -name '*.bin' | head -n1)"
          test -n "$BIN"
          python3 - "$BIN" <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes()
          i=b.find(b'hsqs')
          if i<0: raise SystemExit('no squashfs')
          pathlib.Path('/tmp/re06/rootfs.squashfs').write_bytes(b[i:])
          PY
          sudo unsquashfs -no-progress -d /tmp/re06/rootfs /tmp/re06/rootfs.squashfs >/dev/null
          sudo chown -R "$(id -u):$(id -g)" /tmp/re06/rootfs

          {
            echo '=== /etc/config/wireless ==='
            if [ -f /tmp/re06/rootfs/etc/config/wireless ]; then
              cat /tmp/re06/rootfs/etc/config/wireless
            else
              echo 'SOURCE_ABSENT'
            fi
            echo
            echo '=== disabled references in wireless/default generation ==='
            grep -R -n -E "disabled|radio0|radio1|wlan00|wlan10"               /tmp/re06/rootfs/etc/uci-defaults/30_wlan               /tmp/re06/rootfs/etc/uci-defaults/99_oem               /tmp/re06/rootfs/bin/config_generate               /tmp/re06/rootfs/lib/wifi 2>/dev/null || true
          } > RE-WANDETECT-WIRELESS-GATE-06/RE-WR1200E-WIRELESS-BOOT-EVIDENCE.txt

          for rel in             etc/config/wireless             etc/uci-defaults/30_wlan             etc/uci-defaults/99_oem             bin/config_generate             lib/wifi/radio0-mt7628.sh             lib/wifi/radio1-mt7663e.sh
          do
            src="/tmp/re06/rootfs/$rel"
            if [ -f "$src" ]; then
              dst="RE-WANDETECT-WIRELESS-GATE-06/RE-$(echo "$rel" | tr / _)"
              cp "$src" "$dst"
            fi
          done

      - name: Prepare exact LEDE 17.01.5 RT3883 SDK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/re06
          SDK_NAME='lede-sdk-17.01.5-ramips-rt3883_gcc-5.4.0_musl-1.1.16.Linux-x86_64.tar.xz'
          SDK_BASE='https://archive.openwrt.org/releases/17.01.5/targets/ramips/rt3883'

          curl -fL --retry 3 "$SDK_BASE/sha256sums" -o sha256sums
          curl -fL --retry 3 "$SDK_BASE/$SDK_NAME" -o "$SDK_NAME"

          SDK_SHA="$(awk -v n="$SDK_NAME" '$NF==n || $NF=="*"n {print $1; exit}' sha256sums)"
          test -n "$SDK_SHA"
          echo "$SDK_SHA  $SDK_NAME" | sha256sum -c -
          printf '%s  %s\n' "$SDK_SHA" "$SDK_NAME" \
            > "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-LEDE17-RT3883-SDK-SHA256.txt"

          mkdir -p sdk
          tar -xJf "$SDK_NAME" -C sdk --strip-components=1

          cd sdk
          mkdir -p package/kernel/re-wandetect-proc-compat/src
          cp "$GITHUB_WORKSPACE/firmware/f9k1103-lede-17.01.5/RE-wandetect-proc-compat.c" \
            package/kernel/re-wandetect-proc-compat/src/RE-wandetect-proc-compat.c
          cp "$GITHUB_WORKSPACE/firmware/f9k1103-lede-17.01.5/RE-wandetect-proc-compat-Makefile" \
            package/kernel/re-wandetect-proc-compat/Makefile

          # The official SDK is already the exact ramips/rt3883 kernel/toolchain
          # generation used by LEDE 17.01.5. Only enable our target module.
          echo 'CONFIG_PACKAGE_kmod-re-wandetect-proc-compat=m' >> .config
          make defconfig

          {
            echo "SDK_NAME=$SDK_NAME"
            grep -E 'CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_rt3883|CONFIG_PACKAGE_kmod-re-wandetect' .config || true
            find staging_dir -maxdepth 2 -type d -name 'toolchain-mipsel*' -print
            find build_dir -maxdepth 2 -type d -name 'linux-ramips*' -print
          } > "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-SDK-BUILD-CONTEXT.txt"

      - name: Compile target kernel module with exact SDK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/re06/sdk

          # No target Cudy userspace is compiled here. This builds only the
          # target-side procfs ABI module against the exact 17.01.5 RT3883 SDK.
          # Explicit ARCH/CROSS_COMPILE required by the archived LEDE SDK.
          make -j2 package/re-wandetect-proc-compat/compile V=s

          KO="$(find build_dir -type f -name 're_wandetect_compat.ko' -print -quit)"
          test -n "$KO"
          file "$KO" | tee "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-WANDETECT-KMOD-FILE.txt"
          sha256sum "$KO" | tee "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-WANDETECT-KMOD-SHA256.txt"
          modinfo "$KO" > "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-WANDETECT-KMOD-MODINFO.txt" 2>&1 || true
          strings -a "$KO" | grep -E 'wandetect|ipaddr|gateway|macaddr|iface|proto|service|auto-detect' \
            > "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-WANDETECT-KMOD-CONTRACT.txt"
          cp "$KO" "$GITHUB_WORKSPACE/RE-WANDETECT-WIRELESS-GATE-06/RE-re_wandetect_compat.ko"

      - name: Gate and package
        shell: bash
        run: |
          set -euo pipefail
          O=RE-WANDETECT-WIRELESS-GATE-06
          test -s "$O/RE-re_wandetect_compat.ko"
          grep -q 'MIPS' "$O/RE-WANDETECT-KMOD-FILE.txt"
          for token in wandetect ipaddr gateway macaddr iface proto service; do
            grep -q "$token" "$O/RE-WANDETECT-KMOD-CONTRACT.txt"
          done
          {
            echo 'KMOD_COMPILE=PASS'
            echo 'KMOD_TOOLCHAIN=EXACT_LEDE_17.01.5_RAMIPS_RT3883_SDK'
            echo 'CUDY_USERSPACE_WANDETECT=UNCHANGED'
            echo 'CUDY_BUSYBOX=NEVER_REPLACE'
            echo 'FLASH_AUTHORIZATION=NO'
          } > "$O/RE-GATE-STATUS.txt"
          (
            cd "$O"
            find . -maxdepth 1 -type f -name 'RE-*' -print0 | sort -z | xargs -0 sha256sum > RE-SHA256SUMS.txt
          )
          tar -czf RE-WANDETECT-WIRELESS-GATE-06.tar.gz "$O"
          sha256sum RE-WANDETECT-WIRELESS-GATE-06.tar.gz > RE-WANDETECT-WIRELESS-GATE-06.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RE-WANDETECT-WIRELESS-GATE-06
          path: |
            RE-WANDETECT-WIRELESS-GATE-06.tar.gz
            RE-WANDETECT-WIRELESS-GATE-06.tar.gz.sha256
