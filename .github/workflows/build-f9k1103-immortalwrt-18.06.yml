name: Build F9K1103 ImmortalWrt 18.06

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-f9k1103-immortalwrt-18.06.yml'
      - 'firmware/f9k1103-immortalwrt-18.06/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f9k1103-immortalwrt-18.06-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python2.7 python-is-python2 \
            python3 python3-distutils rsync unzip zlib1g-dev file wget perl \
            subversion swig time u-boot-tools curl
      - uses: actions/checkout@v4
      - name: Build F9K1103 v1 ImmortalWrt 18.06
        run: bash firmware/f9k1103-immortalwrt-18.06/build-immortalwrt-18.06.sh
      - name: Show validation
        run: |
          ls -lah out-f9k1103-immortalwrt-18.06
          cat out-f9k1103-immortalwrt-18.06/STATIC-VALIDATION.txt
          cat out-f9k1103-immortalwrt-18.06/SHA256SUMS.txt
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: F9K1103-v1-ImmortalWrt-18.06-PORT-WIP
          path: out-f9k1103-immortalwrt-18.06/
          if-no-files-found: error
          compression-level: 0
