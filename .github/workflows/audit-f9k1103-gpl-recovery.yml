name: Map F9K1103 U-Boot HTTP recovery contract

on:
  push:
    branches:
      - f9k1103-gpl-audit
    paths:
      - '.github/workflows/audit-f9k1103-gpl-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep python3 file >/dev/null

      - name: Fetch official GPL
        run: |
          set -euo pipefail
          mkdir -p work/src out/files
          curl -L --fail --retry 4 -o work/gpl.tar.gz \
            'https://s3.belkin.com/support/assets/belkin/gpl/F9K1103_v1.10.23.tar.gz'
          echo "8e65bf160929df49fe6b88544709666d0071e7fed56cca3fff933bc7ce60799d  work/gpl.tar.gz" | sha256sum -c -
          tar -xzf work/gpl.tar.gz -C work/src
          ROOT=work/src/F9K1103_v1.10.23
          test -d "$ROOT"

      - name: Locate U-Boot HTTPD implementation and boot entry
        run: |
          set -euo pipefail
          ROOT=work/src/F9K1103_v1.10.23
          U="$ROOT/platforms/rt3883/uboot"

          rg -l -i --hidden \
            'UBOOT_HTTPD|httpd|web.*upgrade|upgrade.*web|multipart|Content-Length|POST /|index\.html|firmware.*upload|RESET_BUTTON|BUTTON_PRESSED|N750F9K1103VB|PDTAG' \
            "$U" "$ROOT/project/belkin/WG9117A23-AK/F9K1103v1_DB-N750" \
            | sort -u > out/RECOVERY-SOURCE-FILES.txt || true

          rg -n -i -C 12 \
            'UBOOT_HTTPD|httpd|web.*upgrade|upgrade.*web|multipart|Content-Length|POST /|firmware.*upload|RESET_BUTTON|BUTTON_PRESSED|N750F9K1103VB|PDTAG' \
            "$U" "$ROOT/project/belkin/WG9117A23-AK/F9K1103v1_DB-N750" \
            > out/RECOVERY-SOURCE-HITS.txt || true

          rg -n -i -C 8 \
            'ipaddr|serverip|gatewayip|netmask|192\.168\.|10\.10\.|HTTP.*IP|web.*IP|IP_ADDR|our_ip|host_ip' \
            "$U" "$ROOT/project/belkin/WG9117A23-AK/F9K1103v1_DB-N750" \
            > out/RECOVERY-IP-HITS.txt || true

          rg -n -i -C 12 \
            'RESET_BUTTON_GPIO_NO|BUTTON_PRESSED|gpio.*25|25.*gpio|bootdelay|autoboot|menu|reset.*button|recovery|failsafe' \
            "$U" "$ROOT/project/belkin/WG9117A23-AK/F9K1103v1_DB-N750" \
            > out/RECOVERY-ENTRY-HITS.txt || true

          rg -n -i -C 12 \
            'PDTAG|N750F9K1103VB|TRX_MAGIC|crc|checksum|image.*check|upgrade.*check|SPI_UPGRADE_CHECK|firmware.*size|7864320' \
            "$U" "$ROOT/project/belkin/WG9117A23-AK/F9K1103v1_DB-N750" \
            > out/RECOVERY-IMAGE-CHECK-HITS.txt || true

      - name: Preserve highest-value recovery sources
        run: |
          set -euo pipefail
          ROOT=work/src/F9K1103_v1.10.23
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('work/src/F9K1103_v1.10.23')
          out=Path('out/files')
          hits=Path('out/RECOVERY-SOURCE-FILES.txt').read_text(errors='replace').splitlines()
          copied=[]
          for raw in hits:
              p=Path(raw)
              if not p.is_absolute():
                  p=root/p
              try:
                  rel=p.relative_to(root)
              except Exception:
                  # rg emitted work/src/... path
                  s=str(p)
                  marker='F9K1103_v1.10.23/'
                  if marker not in s: continue
                  rel=Path(s.split(marker,1)[1])
                  p=root/rel
              if not p.is_file() or p.stat().st_size>1_000_000: continue
              d=out/rel
              d.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,d)
              copied.append(str(rel))
          Path('out/COPIED-RECOVERY-SOURCES.txt').write_text('\n'.join(sorted(copied))+'\n')
          PY

      - name: Derive recovery facts without guessing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,csv
          blobs={}
          for name in ['RECOVERY-SOURCE-HITS.txt','RECOVERY-IP-HITS.txt','RECOVERY-ENTRY-HITS.txt','RECOVERY-IMAGE-CHECK-HITS.txt']:
              blobs[name]=Path('out/'+name).read_text(errors='replace')
          alltxt='\n'.join(blobs.values())
          low=alltxt.lower()

          def first_ips(text):
              return sorted(set(re.findall(r'\b(?:\d{1,3}\.){3}\d{1,3}\b',text)))

          facts=[
            ('uboot_httpd_enabled', 'uboot_httpd=y' in low, 'official board config'),
            ('uboot_httpd_rsa_disabled', 'uboot_httpd_rsa is not set' in low, 'official board config'),
            ('reset_gpio_25', bool(re.search(r'RESET_BUTTON_GPIO_NO\D+25',alltxt,re.I)), 'official board header'),
            ('pdt_tag_N750F9K1103VB', 'n750f9k1103vb' in low, 'official board header/config'),
            ('spi_upgrade_check', 'ralink_spi_upgrade_check' in low, 'U-Boot config/build'),
            ('http_source_found', any(x in low for x in ('httpd','multipart','content-length')), 'U-Boot source sweep'),
          ]
          ips=first_ips(blobs['RECOVERY-IP-HITS.txt'])
          with open('out/RECOVERY-FACTS.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['fact','verified','basis']);w.writerows((a,'YES' if b else 'NO',c) for a,b,c in facts)
          Path('out/RECOVERY-IP-CANDIDATES.txt').write_text('\n'.join(ips)+'\n')
          Path('out/RECOVERY-FACTS.txt').write_text('\n'.join(f'{a}={"YES" if b else "NO"} basis={c}' for a,b,c in facts)+'\n')
          PY

          cat > out/STATUS.md <<'EOF'
          # F9K1103 U-Boot recovery source audit

          This report only classifies what the official GPL source proves.
          It does not invent a button sequence, recovery address, or upload procedure.
          Any exact recovery-entry sequence is SOURCE_VERIFIED only if the implementation
          or board-specific boot path explicitly proves it.
          EOF
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F9K1103-v1.10.23-UBOOT-RECOVERY-MAP
          path: out/
          compression-level: 6
