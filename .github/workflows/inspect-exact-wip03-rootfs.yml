name: Inspect exact flashed WIP03 rootfs

on:
  push:
    branches:
      - f9k1103-cudy-port-wip03
    paths:
      - '.github/workflows/inspect-exact-wip03-rootfs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip lua5.1 curl file
      - name: Download exact flashed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ART=11320230824
          mkdir -p /tmp/art out-exact-wip03
          rm -rf /tmp/root
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$ART/zip"             -o /tmp/art.zip
          unzip -q /tmp/art.zip -d /tmp/art
          IMG=/tmp/art/RE-F9K1103-LEDE-17.01.5-CUDY-WIP03-RADIOFIX-sysupgrade.bin
          python3 tools/repack-f9k1103-wip03.py extract-rootfs "$IMG" /tmp/rootfs.sqfs
          sudo unsquashfs -no-progress -d /tmp/root /tmp/rootfs.sqfs >/dev/null

          {
            echo "=== theme files ==="
            find /tmp/root/usr/lib/lua/luci/view/themes/bootstrap -maxdepth 1 -type f -printf '%f %s\n' | sort
            echo
            echo "=== luci root modules ==="
            find /tmp/root/usr/lib/lua/luci -maxdepth 1 -type f -printf '%f %s\n' | sort
            echo
            echo "=== root controllers ==="
            find /tmp/root/usr/lib/lua/luci/controller -maxdepth 2 -type f -printf '%P %s\n' | sort
          } > out-exact-wip03/RE-FILE-LIST.txt

          cp /tmp/root/usr/lib/lua/luci/view/indexer.htm out-exact-wip03/RE-view-indexer.htm
          cp /tmp/root/usr/lib/lua/luci/view/themes/bootstrap/index.htm out-exact-wip03/RE-bootstrap-index.htm
          cp /tmp/root/usr/lib/lua/luci/view/themes/bootstrap/header.htm out-exact-wip03/RE-bootstrap-header.htm
          cp /tmp/root/usr/lib/lua/luci/view/themes/bootstrap/footer.htm out-exact-wip03/RE-bootstrap-footer.htm
          cp /tmp/root/usr/lib/lua/luci/view/themes/bootstrap/sysauth.htm out-exact-wip03/RE-bootstrap-sysauth.htm
          cp /tmp/root/usr/lib/lua/luci/dispatcher.lua out-exact-wip03/RE-dispatcher.lua
          cp /tmp/root/www/luci-static/bootstrap/js/cbi.js out-exact-wip03/RE-cbi.js
          cp /tmp/root/www/luci-static/bootstrap/js/sysauth.js out-exact-wip03/RE-sysauth.js

          for f in gui.lua description.lua; do
            if [ -e "/tmp/root/usr/lib/lua/luci/$f" ]; then
              cp "/tmp/root/usr/lib/lua/luci/$f" "out-exact-wip03/RE-$f"
              file "/tmp/root/usr/lib/lua/luci/$f" >> out-exact-wip03/RE-LUA-FILE-TYPES.txt
              strings -a "/tmp/root/usr/lib/lua/luci/$f" > "out-exact-wip03/RE-$f.strings"
              luac5.1 -l -p "/tmp/root/usr/lib/lua/luci/$f" > "out-exact-wip03/RE-$f.luac-list.txt" 2>&1 || true
            fi
          done

          file /tmp/root/usr/lib/lua/luci/dispatcher.lua >> out-exact-wip03/RE-LUA-FILE-TYPES.txt
          luac5.1 -l -p /tmp/root/usr/lib/lua/luci/dispatcher.lua > out-exact-wip03/RE-dispatcher.luac-list.txt 2>&1 || true

          {
            echo "=== indexer references ==="
            grep -Rns -E 'indexer|themes/.*/index|show_section|entry\(\{\}|node\(\)\.target|sysauth'               /tmp/root/usr/lib/lua/luci /tmp/root/www 2>/dev/null | head -n 500 || true
          } > out-exact-wip03/RE-INDEX-ROUTING-GREP.txt

          {
            echo "=== uhttpd Lua support ==="
            if [ -e /tmp/root/usr/lib/uhttpd_lua.so ]; then ls -l /tmp/root/usr/lib/uhttpd_lua.so; else echo "NO /usr/lib/uhttpd_lua.so"; fi
            if [ -e /tmp/root/usr/lib/uhttpd_lua.so.0 ]; then ls -l /tmp/root/usr/lib/uhttpd_lua.so.0; fi
            echo
            echo "=== package names ==="
            grep '^Package: ' /tmp/root/usr/lib/opkg/status | grep -E 'uhttpd|lua' || true
          } > out-exact-wip03/RE-UHTTPD-LUA-SUPPORT.txt
          {
            echo "=== controller sysauth declarations ==="
            grep -RsnE 'sysauth|sysauth_authenticator|entry\\(\\{\\}|entry\\(\\{"admin"' /tmp/root/usr/lib/lua/luci/controller 2>/dev/null || true
          } > out-exact-wip03/RE-CONTROLLER-SYSAUTH.txt

          cp -a /tmp/root/etc/init.d/uhttpd out-exact-wip03/RE-uhttpd-init 2>/dev/null || true
          cp -a /tmp/root/etc/config/uhttpd out-exact-wip03/RE-uhttpd-config 2>/dev/null || true
          grep '^Package: ' /tmp/root/usr/lib/opkg/status | grep -E 'uhttpd|luci|lua' > out-exact-wip03/RE-WEB-PACKAGES.txt || true

          sha256sum out-exact-wip03/* > out-exact-wip03/RE-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EXACT-FLASHED-WIP03-ROOTFS-EVIDENCE
          path: out-exact-wip03/
