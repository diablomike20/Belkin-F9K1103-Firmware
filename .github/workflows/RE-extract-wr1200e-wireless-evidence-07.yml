name: RE WR1200E wireless evidence 07

on:
  push:
    branches: [re-f9k1103-wr1200e-cudy-full-rootfs-port]
    paths:
      - '.github/workflows/RE-extract-wr1200e-wireless-evidence-07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip
      - name: Extract exact wireless evidence
        shell: bash
        run: |
          set -euo pipefail
          O=RE-WR1200E-WIRELESS-EVIDENCE-07
          rm -rf /tmp/re07 "$O"
          mkdir -p /tmp/re07 "$O"
          URL='https://www.cudy.com/cdn/shop/files/WR1200E-R62-2.4.25-20260114-184136-flash.zip?v=12982462962593522136'
          SHA='2e9a8dafc930a2070d45f706ec5d362428475044dcd791232f86eee7b9f4ef21'
          curl -fL --retry 3 "$URL" -o /tmp/re07/donor.zip
          echo "$SHA  /tmp/re07/donor.zip" | sha256sum -c -
          unzip -q /tmp/re07/donor.zip -d /tmp/re07/unzip
          BIN="$(find /tmp/re07/unzip -type f -name '*.bin' | head -n1)"
          python3 - "$BIN" <<'PY'
          import pathlib,sys
          b=pathlib.Path(sys.argv[1]).read_bytes(); i=b.find(b'hsqs')
          if i<0: raise SystemExit('SquashFS missing')
          pathlib.Path('/tmp/re07/rootfs.sqfs').write_bytes(b[i:])
          PY
          sudo unsquashfs -no-progress -d /tmp/re07/root /tmp/re07/rootfs.sqfs >/dev/null
          sudo chown -R "$(id -u):$(id -g)" /tmp/re07/root

          {
            echo "DONOR_CONFIG_WIRELESS_PRESENT=$([ -f /tmp/re07/root/etc/config/wireless ] && echo YES || echo NO)"
            echo
            for f in               /tmp/re07/root/lib/wifi/radio0-mt7628.sh               /tmp/re07/root/lib/wifi/radio1-mt7663e.sh               /tmp/re07/root/etc/uci-defaults/30_wlan               /tmp/re07/root/bin/config_generate
            do
              echo "===== $f ====="
              grep -n -E 'disabled|wifi-device|wifi-iface|radio0|radio1|wlan00|wlan10|default' "$f" 2>/dev/null || true
            done
          } > "$O/RE-WIRELESS-DEFAULT-ANALYSIS.txt"

          for rel in             lib/wifi/radio0-mt7628.sh             lib/wifi/radio1-mt7663e.sh             etc/uci-defaults/30_wlan             bin/config_generate
          do
            src="/tmp/re07/root/$rel"
            test -f "$src" || continue
            cp "$src" "$O/RE-$(echo "$rel" | tr / _)"
          done

          (
            cd "$O"
            find . -maxdepth 1 -type f -name 'RE-*' -print0 | sort -z | xargs -0 sha256sum > RE-SHA256SUMS.txt
          )
          tar -czf RE-WR1200E-WIRELESS-EVIDENCE-07.tar.gz "$O"
          sha256sum RE-WR1200E-WIRELESS-EVIDENCE-07.tar.gz > RE-WR1200E-WIRELESS-EVIDENCE-07.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RE-WR1200E-WIRELESS-EVIDENCE-07
          path: |
            RE-WR1200E-WIRELESS-EVIDENCE-07.tar.gz
            RE-WR1200E-WIRELESS-EVIDENCE-07.tar.gz.sha256
