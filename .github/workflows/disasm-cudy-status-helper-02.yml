name: Disassemble Cudy status helper

on:
  push:
    branches:
      - f9k1103-cudy-port-wip03-clean-audit
    paths:
      - '.github/workflows/disasm-cudy-status-helper-02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools unzip curl
      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/statush out-statush
          mkdir -p /tmp/statush out-statush
          URL='https://www.cudy.com/cdn/shop/files/WR1200V2-R26-2.4.23-20251224-145945-flash.zip?v=10287497656812635253'
          curl -fL "$URL" -o /tmp/statush/donor.zip
          unzip -q /tmp/statush/donor.zip -d /tmp/statush
          BIN="$(find /tmp/statush -maxdepth 1 -type f -name '*-flash.bin' | head -n1)"
          tail -c +2583296 "$BIN" >/tmp/statush/rootfs.sqfs
          sudo unsquashfs -no-progress -d /tmp/statush/root /tmp/statush/rootfs.sqfs >/dev/null
          curl -fL 'https://github.com/dweekly/luad/releases/download/v0.3.1/luad-0.3.1-linux-x86_64.tar.gz' -o /tmp/statush/luad.tgz
          echo '5e297699463f04e19fda3a867fb9d36d444f848ee0ddf560b6ae383568ec0053  /tmp/statush/luad.tgz' | sha256sum -c -
          tar -xzf /tmp/statush/luad.tgz -C /tmp/statush
          LUAD="$(find /tmp/statush -maxdepth 2 -type f -name luad -perm -111 | head -n1)"
          for rel in             usr/lib/lua/luci/tools/status.lua             usr/lib/lua/luci/model/network.lua             usr/lib/lua/luci/cbi.lua             usr/lib/lua/luci/model/cbi/dhcp/status.lua             usr/lib/lua/luci/model/cbi/wireless/status.lua
          do
            src="/tmp/statush/root/$rel"
            n="$(echo "$rel" | tr '/' '_')"
            "$LUAD" disasm "$src" >"out-statush/$n.disasm.txt" 2>&1 || true
            "$LUAD" origins "$src" >"out-statush/$n.origins.txt" 2>&1 || true
          done
          sha256sum out-statush/* > out-statush/RE-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CUDY-STATUS-HELPER-DISASM-02
          path: out-statush/
